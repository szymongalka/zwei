    <path id="z" d="M318 320H706L318 704H706"/>
  </defs>
  <use href="#z" transform="translate(8 39)" stroke="#576994" stroke-opacity=".26" stroke-width="151" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <use href="#z" transform="translate(0 17)" stroke="url(#depth)" stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#z" stroke="url(#rim)" stroke-width="151" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#z" stroke="url(#glass)" stroke-width="142" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M315 274H690M357 649L681 328M353 661H707" stroke="#FFF" stroke-opacity=".39" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M317 253H694M286 675L660 306M347 638H707" stroke="url(#rim)" stroke-width="3.5" stroke-linecap="round"/>
