<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Zwei</title>
  <desc>A sculpted glass Z on a transparent background.</desc>
  <defs>
    <linearGradient id="depth" x1="298" y1="310" x2="740" y2="756" gradientUnits="userSpaceOnUse">
      <stop stop-color="#548ACC"/><stop offset=".48" stop-color="#547FE0"/><stop offset="1" stop-color="#6359AE"/>
    </linearGradient>
    <linearGradient id="glass" x1="350" y1="250" x2="658" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6F3FF"/><stop offset=".24" stop-color="#8DCDF6"/><stop offset=".49" stop-color="#76A8EC"/><stop offset=".72" stop-color="#9FBBF8"/><stop offset="1" stop-color="#C5B8F3"/>
    </linearGradient>
    <linearGradient id="rim" x1="290" y1="250" x2="735" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".98"/><stop offset=".43" stop-color="#E9F9FF" stop-opacity=".35"/><stop offset="1" stop-color="#F2EBFF" stop-opacity=".85"/>
    </linearGradient>
    <filter id="shadow" x="130" y="180" width="810" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="27"/>
    </filter>
    <filter id="glow" x="180" y="200" width="670" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
