<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=auto"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Zwei web UI — chat with your Zwei workspace."
      data-i18n-meta="description"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      data-theme-color-light="#ffffff"
      data-theme-color-dark="#303030"
      data-theme-color-light-glass="#eef1f7"
      data-theme-color-dark-glass="#080a0f"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zwei" />
    <link rel="icon" type="image/svg+xml" href="/brand/zwei.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/zwei-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/zwei-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #303030;
        color: #fafafa;
      }

      /* Liquid Glass paints its wallpaper from the stylesheet. Keep the boot
         splash on the wallpaper base colour and on <html>, so the canvas veil
         that the glass stylesheet puts on <body> can keep letting the wallpaper
         through once the bundle has loaded. */
      html.theme-liquid-glass {
        background-color: #eef1f7;
      }

      html.theme-liquid-glass.dark {
        background-color: #080a0f;
        color: #fafafa;
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("nanobot-webui.theme");
          } catch {}
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");

          /* Appearance palette and Liquid Glass clarity, applied before the
             bundle loads so the first paint already uses the chosen material. */
          var style = "classic";
          var clarity = "clear";
          try {
            style = localStorage.getItem("nanobot-webui.theme-style") === "liquid-glass"
              ? "liquid-glass"
              : "classic";
            clarity = localStorage.getItem("nanobot-webui.glass-clarity") === "tinted"
              ? "tinted"
              : "clear";
          } catch {}
          if (style === "liquid-glass") {
            document.documentElement.classList.add("theme-liquid-glass");
          }
          document.documentElement.setAttribute("data-glass-clarity", clarity);

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            var glass = style === "liquid-glass";
            var color = glass
              ? themeColor.getAttribute(
                dark ? "data-theme-color-dark-glass" : "data-theme-color-light-glass"
              )
              : null;
            if (!color) {
              color = themeColor.getAttribute(
                dark ? "data-theme-color-dark" : "data-theme-color-light"
              );
            }
            if (color) themeColor.setAttribute("content", color);
          }
        } catch {}
      })();
    </script>
    <title>Zwei</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading Zwei…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "nanobot.locale";
        var copy = {
          en: {
            boot: "Loading Zwei…",
            description: "Zwei web UI — chat with your Zwei workspace."
          },
          "zh-CN": {
            boot: "正在加载 Zwei…",
            description: "Zwei Web UI —— 与你的 Zwei 工作区对话。"
          },
          "zh-TW": {
            boot: "正在載入 Zwei…",
            description: "Zwei Web UI —— 與你的 Zwei 工作區對話。"
          },
          fr: {
            boot: "Chargement de Zwei…",
            description: "Interface web Zwei — discutez avec votre espace de travail Zwei."
          },
          ja: {
            boot: "Zwei を読み込み中…",
            description: "Zwei Web UI — Zwei ワークスペースと会話します。"
          },
          ko: {
            boot: "Zwei 불러오는 중…",
            description: "Zwei 웹 UI — Zwei 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando Zwei…",
            description: "Interfaz web de Zwei: conversa con tu espacio de trabajo de Zwei."
          },
          "pt-BR": {
            boot: "Carregando Zwei…",
            description: "Interface web do Zwei — converse com o seu espaço de trabalho do Zwei."
          },
          vi: {
            boot: "Đang tải Zwei…",
            description: "Giao diện web Zwei — trò chuyện với không gian làm việc Zwei của bạn."
          },
          id: {
            boot: "Memuat Zwei…",
            description: "UI web Zwei — ngobrol dengan ruang kerja Zwei Anda."
          },
          pl: {
            boot: "Ładowanie Zwei…",
            description: "Interfejs WWW Zwei — rozmawiaj ze swoim agentem w obszarze roboczym."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
